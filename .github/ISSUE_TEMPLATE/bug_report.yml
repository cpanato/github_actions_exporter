name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exporter version
      description: Output of `github_actions_exporter --version` or the container image tag.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run the exporter?
      options:
        - Binary
        - Container image
        - Helm chart
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Flags and configuration
      description: The flags/environment variables you use. **Remove tokens and secrets.**
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs, ideally with `--log.level=debug`. **Remove tokens and secrets.**
      render: text
